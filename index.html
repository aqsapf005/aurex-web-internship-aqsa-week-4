<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Manager — Week 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
<div class="wrap">
  <h1>Today's tasks</h1>
  <p class="sub">Stored in this browser — refresh, and everything stays put.</p>

  <form id="task-form" novalidate>
    <div class="row">
      <input type="text" id="task-input" placeholder="What needs doing?" maxlength="120">
      <button type="submit">Add task</button>
    </div>
    <div class="err" id="err"></div>
  </form>

  <div class="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="done">Complete</button>
    <span class="count" id="count"></span>
  </div>

  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>Nothing here yet.</p>
</div>

<script src="scripts/main.js"></script>
</body>
</html>
